name: CI

on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: pyperscan
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Nix Flake checks
        run: |
          nix flake check \
              --keep-going \
              --print-build-logs
      - name: Code coverage
        run: |
          nix build .#checks.x86_64-linux.pytest-coverage -o pytest
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: pytest
          files: pytest/coverage.codecov
  build:
    needs:
      - checks
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64-linux
            drv: "shared"
          - os: ubuntu-latest
            arch: x86_64-linux
            drv: "hyperscan"
          - os: ubuntu-latest
            arch: x86_64-linux
            drv: "vectorscan"
          - os: ubuntu-24.04-arm
            arch: aarch64-linux
            drv: "vectorscan"
          - os: macos-latest
            arch: aarch64-darwin
            drv: vectorscan
    name: Nix - ${{ matrix.arch }}.${{ matrix.drv }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: pyperscan
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build nix shell
        run: |
          nix build -L .#devShells.${{ matrix.arch }}.default --option system ${{ matrix.arch }} --extra-platforms ${{ matrix.arch }}
      - name: Build nix package
        run: nix build -L .?submodules=1#packages.${{ matrix.arch }}.default.${{ matrix.drv }} --option system ${{ matrix.arch }} --extra-platforms ${{ matrix.arch }}

  sdist:
    name: Build - sdist
    needs:
      - checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          container: off
          command: sdist
          args: -o dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  linux-wheels:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            arch: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            arch: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            arch: aarch64-unknown-linux-musl
    name: Build wheel - ${{ matrix.arch }}
    needs:
      - checks
    runs-on: ${{ matrix.os }}
    env:
      image: ghcr.io/vlaci/pyperscan-builder-${{ matrix.arch }}
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Cache rust
        uses: Swatinem/rust-cache@v2
        with:
          key: wheel-linux-${{ matrix.arch }}-${{ matrix.tag }}
      - name: Install dependencies
        uses: extractions/setup-crate@v2
        with:
          owner: casey
          name: just
          version: 1.9.0
      - name: Ensure Podman is installed
        run: |
          sudo apt update
          sudo apt install -q -y podman
      - name: Log in to the GitHub Container registry
        uses: redhat-actions/podman-login@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check cached build image
        run: |
          TAG=${{hashFiles(format('Containerfile.{0}', matrix.arch)) }}
          echo tag=$TAG >> $GITHUB_ENV
      - run: just wheel ${{ matrix.arch }}
      - run: podman push $image:$tag
      - run: podman push $image:latest
        if: github.ref_name == 'main'
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.arch }}
          path: dist

  macos-wheel:
    needs:
      - checks
    name: Build wheel - ${{ matrix.target }}-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.12"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            os: macos-15-intel
          - target: aarch64
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Cache rust
        uses: Swatinem/rust-cache@v2
        with:
          key: wheel-macos-${{ matrix.target }}
      - name: Install dependencies
        run: |
          brew install boost ragel
          echo container= > $GITHUB_ENV
      - name: Disable tools
        run: |
          rm hyperscan-sys/*/tools/CMakeLists.txt
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -F vectorscan
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}-darwin
          path: dist
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Test wheels
        run: |
          uv sync --no-install-project --group test
          uv pip install dist/*.whl
          .venv/bin/pytest

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs:
      - sdist
      - linux-wheels
      - macos-wheel
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: messense/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --skip-existing dist/*/*
