[package]
name = "pyperscan"
authors.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
name = "pyperscan"
crate-type = ["cdylib"]

[dependencies]
bitflags = "2.13.2"
foreign-types = "0.5.0"
pyo3 = { version = "0.30.0", features = ["extension-module", "abi3-py311", "abi3t-py315"] }
thiserror = "2.0.21"
hyperscan-sys = { path = "./hyperscan-sys" }

[features]
vectorscan = ["hyperscan-sys/vectorscan"]

[workspace]
resolver = "2"
members = [".", "hyperscan-sys"]

[workspace.package]
version = "0.0.0"
authors = ["László Vaskó <opensource@vlaci.email>"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.83"
description = "An opinionated Python binding for Hyperscan focusing on easy of use and safety."
repository = "https://github.com/vlaci/pyperscan"
homepage = "https://github.com/vlaci/pyperscan"
readme = "README.md"
